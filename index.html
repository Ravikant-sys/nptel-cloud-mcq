<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPTEL Ace — Cloud Computing & Blockchain Assignments</title>
    <meta name="description" content="Practice NPTEL Cloud Computing and Blockchain MCQ assignments with instant feedback, score tracking, and a Duolingo-style quiz experience.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <!-- ── Header ──────────────────────────────────────────── -->
    <header class="site-header">
        <div class="header-left">
            <a class="header-logo" id="header-logo" href="index.html">
                <img src="assets/logo.jpg" alt="NPTEL Ace" class="logo-img">
                <span>NPTEL <span class="logo-ace">Ace</span></span>
            </a>
        </div>
        <div class="header-right">
            <div class="streak-display" id="streak-display" style="display:none;">
                <span>🔥</span>
                <span id="streak-count">0</span>
            </div>
            <button id="theme-toggle" class="theme-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </header>

    <!-- ── Main Content ────────────────────────────────────── -->
    <main class="main-content">
        <!-- View 1: Course Selection -->
        <div id="view-courses">
            <div class="hero-section">
                <img src="assets/logo.jpg" alt="NPTEL Ace Mascot" class="hero-mascot">
                <h1 class="hero-title">NPTEL <span class="highlight">Ace</span></h1>
                <p class="hero-subtitle">Pick a course to start practicing</p>
            </div>

            <div class="course-grid" id="course-selector">
                <div class="course-card" id="card-cloud" onclick="selectCourse('cloud')">
                    <div class="course-icon">☁️</div>
                    <div class="course-info">
                        <h3>Cloud Computing</h3>
                        <p>Distributed Systems, Virtualization & Azure/GCP</p>
                        <div class="course-stats" id="cloud-stats"></div>
                    </div>
                </div>
                <div class="course-card" id="card-blockchain" onclick="selectCourse('blockchain')">
                    <div class="course-icon">⛓️</div>
                    <div class="course-info">
                        <h3>Blockchain & Applications</h3>
                        <p>Cryptography, Consensus & Cryptocurrency</p>
                        <div class="course-stats" id="blockchain-stats"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- View 2: Dashboard (Week Selection) -->
        <div id="view-dashboard" class="view-hidden">
            <div class="dashboard-header">
                <h2 class="dashboard-title" id="dashboard-title">Cloud Computing</h2>
                <button class="back-to-courses" onclick="resetCourseSelection()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Courses
                </button>
            </div>
            <div class="dashboard-grid" id="dashboard"></div>
        </div>
    </main>

    <script src="assets/data.js"></script>
    <script src="assets/script.js"></script>
</body>
</html>
