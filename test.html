<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPTEL Ace — Quiz</title>
    <meta name="description" content="NPTEL Cloud Computing and Blockchain MCQ practice test with instant feedback.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <!-- ── Progress Bar ────────────────────────────────────── -->
    <div class="quiz-progress-bar">
        <div class="quiz-progress-fill" id="progress-fill" style="width: 0%;"></div>
    </div>

    <!-- ── Quiz Header ─────────────────────────────────────── -->
    <div class="quiz-header">
        <a href="index.html" class="quiz-close-btn" id="quiz-close" aria-label="Exit quiz">✕</a>
        <span class="quiz-counter" id="quiz-counter">
            <span class="current">0</span> / <span id="quiz-total">0</span>
        </span>
        <div class="quiz-streak-badge" id="quiz-streak">
            🔥 <span id="quiz-streak-count">0</span>
        </div>
    </div>

    <!-- ── Quiz Body (One question at a time) ──────────────── -->
    <div class="quiz-body" id="quiz-body">
        <div class="question-container" id="question-container">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- ── Bottom Bar (Check / Continue) ───────────────────── -->
    <div class="quiz-bottom-bar" id="bottom-bar">
        <div class="bottom-bar-inner">
            <div class="feedback-section" id="feedback-section">
                <div class="feedback-header">
                    <span class="feedback-icon" id="feedback-icon">✅</span>
                    <span class="feedback-title" id="feedback-title">Correct!</span>
                </div>
                <p class="feedback-solution" id="feedback-solution"></p>
            </div>
            <button class="quiz-action-btn check-btn" id="action-btn" disabled onclick="handleActionClick()">
                CHECK
            </button>
        </div>
    </div>

    <!-- ── Confetti Container ──────────────────────────────── -->
    <div class="confetti-container" id="confetti-container"></div>

    <!-- ── Results Screen (hidden initially) ───────────────── -->
    <div class="results-screen view-hidden" id="results-screen">
        <div class="results-emoji" id="results-emoji">🎉</div>
        <h2 class="results-title" id="results-title">Lesson Complete!</h2>
        <p class="results-subtitle" id="results-subtitle">Great work finishing this quiz.</p>
        <div class="results-stats" id="results-stats">
            <div class="result-stat-card">
                <div class="result-stat-value" id="stat-score">0</div>
                <div class="result-stat-label">Score</div>
            </div>
            <div class="result-stat-card">
                <div class="result-stat-value" id="stat-accuracy">0%</div>
                <div class="result-stat-label">Accuracy</div>
            </div>
            <div class="result-stat-card">
                <div class="result-stat-value warning" id="stat-streak">0</div>
                <div class="result-stat-label">Best Streak</div>
            </div>
        </div>
        <div class="results-actions">
            <button class="result-btn primary" onclick="location.reload()">Try Again</button>
            <a class="result-btn secondary" href="index.html" id="back-to-dashboard-btn">Back to Dashboard</a>
        </div>
    </div>

    <!-- ── Scripts ─────────────────────────────────────────── -->
    <script src="assets/data.js"></script>
    <script src="assets/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initTest);
    </script>
</body>
</html>
